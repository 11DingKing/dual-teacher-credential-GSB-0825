ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.dualteacher.ApplicationKt.module ]
    }
}

dualteacher {
    database {
        url = "jdbc:postgresql://localhost:5432/dualteacher"
        url = ${?JDBC_DATABASE_URL}
        url = ${?DATABASE_URL}
        user = "dualteacher"
        user = ${?DATABASE_USER}
        password = "dualteacher"
        password = ${?DATABASE_PASSWORD}
        maximumPoolSize = 10
        maximumPoolSize = ${?DB_POOL_SIZE}
    }
}
